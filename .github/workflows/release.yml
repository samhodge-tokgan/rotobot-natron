name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Every job runs on the project's ephemeral GCE runners. A tag re-runs the
  # tests (and the Natron round trip) before anything is built or published.
  test:
    runs-on: [self-hosted, linux, x64, gce-cpu]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    container: python:${{ matrix.python-version }}-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -e '.[dev]' && pytest -q

  natron:
    runs-on: [self-hosted, linux, x64, gce-cpu]
    # Natron loads GL/X client libraries from the host; the runner image has
    # none, so the job brings its own (NatronRenderer -t needs no X server).
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Natron's host libraries
        run: tests/natron/ci-deps.sh
      - name: Natron 2.5.0 round trip
        run: tests/natron/ci.sh

  build:
    needs: [test, natron]
    runs-on: [self-hosted, linux, x64, gce-cpu]
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # The tag name never reaches `python -m build` -- the version comes from
      # the tree -- so a tag cut without bumping _version.py would build the
      # previous version, which PyPI rejects as a duplicate.
      - name: The artefact version must match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%-rc*}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/[^-]+-(.*)\.tar\.gz|\1|')
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME wants version $tag but the tree builds $built." \
                 "Bump src/rotobot_natron/_version.py and re-cut the tag."
            exit 1
          fi

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: [self-hosted, linux, x64, gce-cpu]
    # Dry-run tags (vX.Y.Z-rc*) build but do NOT publish — gives you a
    # chance to inspect the sdist contents on the Actions artefact tab
    # before pushing a real tag.
    if: ${{ !contains(github.ref_name, '-rc') }}
    environment:
      name: pypi
      url: https://pypi.org/p/rotobot-natron
    permissions:
      id-token: write  # OIDC — trusted publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
