name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pushes to main run on the project's ephemeral GCE runners. Pull requests
  # (which may come from forks) never reach self-hosted runners: they run the
  # same tests on GitHub-hosted ones.
  pytest:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, gce-cpu]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    container: python:${{ matrix.python-version }}-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -e '.[dev]' && pytest -q

  natron:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, gce-cpu]
    steps:
      - uses: actions/checkout@v4
      - name: Natron 2.5.0 round trip
        run: tests/natron/ci.sh

  pytest-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -q -e '.[dev]' && pytest -q
