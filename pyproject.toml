[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotobot-natron"
# The version lives in src/rotobot_natron/_version.py only; release.yml checks
# the tag against it.
dynamic = ["version"]
description = "Edit Rotobot-Next lozenge_bezier_anim JSON in Natron as native Roto shapes, and export the edits back to the same JSON."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sam Hodge", email = "sam.hodge@tokgan.com" }]
keywords = ["natron", "rotobot", "roto", "vfx", "bezier", "b-spline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
]
# None: Natron's bundled Python has no numpy, so everything here is plain Python.
dependencies = []

[project.urls]
Homepage = "https://tokgan.com"
Source = "https://github.com/samhodge-tokgan/rotobot-natron"
Issues = "https://github.com/samhodge-tokgan/rotobot-natron/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rotobot-natron = "rotobot_natron.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rotobot_natron._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rotobot_natron = ["py.typed", "plugin/*.py"]
